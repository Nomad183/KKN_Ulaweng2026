<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Desa Ulaweng (GitHub Actions)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .login-container { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h1, h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="password"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 400px; font-family: monospace; font-size: 13px; background-color: #fafafa; }
        button { background-color: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        button:hover { background-color: #45a049; }
        .btn-inline { width: auto; margin-right: 10px; }
        .alert { padding: 12px; margin-bottom: 20px; border-radius: 4px; display: none; font-weight: 500; text-align: left; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .logout-btn { background-color: #d9534f; width: auto; padding: 6px 12px; font-size: 13px; float: right; }
        .logout-btn:hover { background-color: #c9302c; }
        .info-box { background: #e7f3fe; border-left: 4px solid #2196F3; padding: 10px 15px; margin-bottom: 20px; font-size: 14px; color: #0c5460; }
    </style>
</head>
<body>

    <!-- SCREEN LOGIN -->
    <div id="loginScreen" class="login-container">
        <h2>Login Admin Ulaweng</h2>
        <div class="form-group">
            <label>Kata Sandi:</label>
            <input type="password" id="adminPassword" placeholder="Masukkan password...">
        </div>
        <button type="button" onclick="handleLogin()">Masuk</button>
        <div id="loginAlert" class="alert alert-error" style="margin-top: 15px;"></div>
    </div>

    <!-- DASHBOARD ADMIN -->
    <div id="adminDashboard" class="container" style="display: none;">
        <div style="overflow: hidden; margin-bottom: 20px;">
            <h1 style="float: left; margin: 0;">Admin Panel Desa Ulaweng</h1>
            <button type="button" class="logout-btn" onclick="handleLogout()">Keluar</button>
        </div>
        
        <div id="alertBox" class="alert"></div>

        <div class="info-box">
            🚀 Sistem terhubung dengan <b>GitHub Actions</b>. Perubahan data akan diproses otomatis oleh server GitHub dalam beberapa detik setelah Anda klik simpan.
        </div>

        <div class="form-group">
            <label>Pilih File JSON yang Ingin Diedit:</label>
            <select id="fileSelector" onchange="loadJSONData()">
                <option value="data/apbdes.json">data/apbdes.json (APBDes)</option>
                <option value="data/data_penduduk.json">data/data_penduduk.json (Data Penduduk)</option>
                <option value="data/demografi_ulaweng.json">data/demografi_ulaweng.json (Demografi Ulaweng)</option>
            </select>
        </div>

        <button type="button" class="btn-inline" style="background-color: #008CBA; width: auto; margin-bottom: 20px;" onclick="loadJSONData()">Muat Ulang File Ini</button>
        
        <div class="form-group">
            <label>Editor File JSON:</label>
            <textarea id="jsonEditor"></textarea>
        </div>

        <button type="button" onclick="saveToGitHub()">Simpan & Jalankan Actions</button>
    </div>

    <script>
        // =========================================================================
        // KONFIGURASI RAHASIA 
        // =========================================================================
        const CONFIG = {
            username: "NAMA_USER_GITHUB_ANDA", // Ganti dengan username GitHub Anda
            repo: "NAMA_REPOSITORY_ANDA",         // Ganti dengan nama repository Anda
            branch: "main",                       // Branch utama (biasanya main/master)
            token: "ghp_KODE_TOKEN_ANDA_DISINI"   // Token GitHub (pastikan memiliki izin repo scope)
        };

        const VALID_PASSWORD = "kknulaweng2026"; // Kata sandi untuk aparat desa
        // =========================================================================

        function handleLogin() {
            const pass = document.getElementById('adminPassword').value;
            const alertBox = document.getElementById('loginAlert');

            if (pass === VALID_PASSWORD) {
                sessionStorage.setItem('isLoggedIn', 'true');
                showDashboard();
            } else {
                alertBox.textContent = "Kata sandi salah!";
                alertBox.style.display = 'block';
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('isLoggedIn');
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('adminPassword').value = '';
        }

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadJSONData();
        }

        window.onload = function() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                showDashboard();
            }
        };

        function showAlert(message, type) {
            const box = document.getElementById('alertBox');
            box.textContent = message;
            box.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
            box.style.display = 'block';
        }

        function loadJSONData() {
            const filePath = document.getElementById('fileSelector').value;
            fetch(filePath)
                .then(res => {
                    if (!res.ok) throw new Error("Gagal mengambil file " + filePath + ". Pastikan file tersebut sudah ada.");
                    return res.json();
                })
                .then(data => {
                    document.getElementById('jsonEditor').value = JSON.stringify(data, null, 2);
                    showAlert("Berhasil memuat file: " + filePath, "success");
                })
                .catch(err => {
                    document.getElementById('jsonEditor').value = "";
                    showAlert("Error: " + err.message, "error");
                });
        }

        async function saveToGitHub() {
            const rawContent = document.getElementById('jsonEditor').value;
            const filePath = document.getElementById('fileSelector').value;

            // Validasi format JSON
            let parsedJSON;
            try {
                parsedJSON = JSON.parse(rawContent);
            } catch (e) {
                showAlert("Format JSON tidak valid! Periksa kembali struktur kurung kurawal/siku atau koma (,).", "error");
                return;
            }

            // Endpoint GitHub Repository Dispatch API
            const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/dispatches`;
            showAlert("Mengirim sinyal ke GitHub Actions...", "success");

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Authorization": `token ${CONFIG.token}`,
                        "Accept": "application/vnd.github.v3+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        event_type: "update_json",
                        client_payload: {
                            file_path: filePath,
                            content: JSON.stringify(parsedJSON, null, 2)
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error("Gagal memicu GitHub Actions. Periksa kembali token atau konfigurasi repository Anda.");
                }

                showAlert(`Berhasil! Sinyal terkirim. GitHub Actions sedang memperbarui file ${filePath} secara otomatis (tunggu 10-20 detik).`, "success");

            } catch (err) {
                showAlert("Terjadi kesalahan: " + err.message, "error");
            }
        }
    </script>
</body>
</html>
